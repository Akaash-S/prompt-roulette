<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Gallery — Prompt Roulette</title>
  <meta name="description" content="Browse and upvote community-saved creative prompts generated by Prompt Roulette!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">🎰</span>
        <span class="logo-text">PROMPT <span class="accent-text">ROULETTE</span></span>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Wheel Generator</a>
        <a href="gallery.html" class="nav-link active">Prompt Gallery</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="gallery-header">
        <h1 class="gallery-title">Community Prompt Gallery</h1>
        <p class="gallery-subtitle">Discover top-voted generated snippets and upvote your favorites!</p>
      </div>

      <div class="gallery-status" id="galleryStatus">
        <div class="spinner"></div>
        <p>Loading community creations...</p>
      </div>

      <div class="gallery-grid hidden" id="galleryGrid"></div>
      
      <div id="toast" class="toast hidden"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Powered by AWS Lambda & DynamoDB | Guaranteed $0 Always-Free Tier</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
