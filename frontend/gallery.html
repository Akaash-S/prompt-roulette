<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Roulette — Prize Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo">PROMPT ROULETTE</a>
      <nav class="nav-links">
        <a href="../index.html" class="nav-link">The Landing</a>
        <a href="index.html" class="nav-link">Spin the Wheel</a>
        <a href="gallery.html" class="nav-link active">Prize Gallery</a>
        <a href="#" class="profile-icon" title="Profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content" style="justify-content: flex-start;">
    
    <!-- Gallery Header Bar -->
    <div class="gallery-header-bar">
      <div>
        <div class="gallery-title-group">
          <span>📑</span>
          <h1>The Gallery</h1>
        </div>
        <p class="page-subtitle" style="text-align: left; margin-top: 0.25rem;">
          A curated collection of your most fortunate spins.
        </p>
      </div>

      <div class="sort-select-wrapper">
        <select id="sortSelect" class="sort-select">
          <option value="newest">SORT: NEWEST</option>
          <option value="top">SORT: TOP VOTED</option>
        </select>
      </div>
    </div>

    <!-- Empty State Component (Matching Image 2) -->
    <div id="emptyState" class="empty-state-container hidden">
      <div class="empty-icon-circle">
        📑
      </div>
      <h2 class="empty-title">The Gallery is Empty</h2>
      <p class="empty-subtitle">
        NO TICKETS PUNCHED YET. BE THE FIRST TO CLAIM A PRIZE FROM THE VOID.
      </p>
      <a href="index.html" class="btn btn-gold">Step Right Up 🎲</a>
    </div>

    <!-- Gallery Grid Component (Matching Image 4) -->
    <div id="galleryGrid" class="gallery-grid hidden"></div>

  </main>

  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
