<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Roulette — Spin & Generate Creative Prompts</title>
  <meta name="description" content="Spin the wheel for random creative prompts: haikus, meme captions, plot twists, band names, villain monologues, and weird inventions with rarity drops!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="confetti-container"></div>
  
  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-icon">🎰</span>
        <span class="logo-text">PROMPT <span class="accent-text">ROULETTE</span></span>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link active">Wheel Generator</a>
        <a href="gallery.html" class="nav-link">Prompt Gallery</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container hero-layout">
      <!-- Wheel Container -->
      <section class="wheel-section">
        <div class="wheel-wrapper">
          <div class="wheel-pointer">▼</div>
          <div class="wheel-container" id="wheel">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
          </div>
        </div>
        <div class="spin-controls">
          <button id="spinBtn" class="btn btn-primary btn-glow">
            <span class="spin-icon">⚡</span> SPIN THE WHEEL
          </button>
        </div>
      </section>

      <!-- Result Showcase -->
      <section class="result-section">
        <div class="card result-card" id="resultCard">
          <div class="card-header">
            <span class="badge category-badge" id="resCategory">READY TO SPIN</span>
            <span class="badge rarity-badge hidden" id="resRarity">COMMON</span>
          </div>

          <div class="card-body">
            <p class="result-placeholder" id="placeholderText">Spin the wheel to roll a creative prompt!</p>
            <p class="result-text hidden" id="resultText"></p>
          </div>

          <div class="card-actions hidden" id="actionButtons">
            <button id="spinAgainBtn" class="btn btn-secondary">🔄 Spin Again</button>
            <button id="remixBtn" class="btn btn-secondary">🎲 Remix Category</button>
            <button id="saveBtn" class="btn btn-accent">💾 Save to Gallery</button>
            <button id="copyBtn" class="btn btn-outline">📋 Copy</button>
          </div>
        </div>
        <div id="toast" class="toast hidden"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>Powered by AWS Lambda & DynamoDB | Guaranteed $0 Always-Free Tier</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
